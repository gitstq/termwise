[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termwise"
version = "1.0.0"
description = "Multi-LLM terminal AI coding assistant with TUI interface"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "gitstq", email = "gitstq@users.noreply.github.com"},
]
keywords = ["ai", "coding", "terminal", "tui", "llm", "claude", "gpt", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "click>=8.1.0",
    "textual>=0.47.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
tiktoken = [
    "tiktoken>=0.5.0",
]
all = [
    "termwise[dev]",
    "termwise[tiktoken]",
]

[project.scripts]
termwise = "termwise.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/termwise"
Repository = "https://github.com/gitstq/termwise"
Issues = "https://github.com/gitstq/termwise/issues"
Changelog = "https://github.com/gitstq/termwise/releases"

[tool.setuptools.packages.find]
include = ["termwise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
